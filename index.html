<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

input[type=search],input[type=text],textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.ch sup{font-size:.62em;position:relative;top:-.4em;line-height:0;vertical-align:baseline}.ch{color:var(--tx);font-weight:400;font-size:.9em;line-height:1.1;min-height:1.1em;padding-right:.5em;white-space:pre}

.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.msg{color:var(--mut);font-size:14px;min-height:1.4em;margin-top:10px}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.item{flex-wrap:wrap;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}.item .main{flex:1 1 40%;text-align:left;background:none;border:0;cursor:pointer;padding:4px;min-width:0}.item .main b{display:block;font-weight:600}.item .main span{color:var(--mut);font-size:14px}.item .pill.sm{padding:2px 10px;min-height:34px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}.panel label{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--tx);font-size:16px}h2{font-size:18px;margin:26px 0 4px}
.stgbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}.stt{flex:1 1 100%;font-size:1.1rem}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.ro #new,body.ro #edit,body.ro #del,body.ro #imp{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%}.dlg p{margin:8px 0 16px}.dlg .danger{background:#e5484d;border-color:#e5484d;color:#fff}
.kt{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}.kt table{border-collapse:collapse;width:100%;min-width:520px}.kt th,.kt td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}.kt th{background:var(--panel)}.kt .kg td{background:var(--panel);font-weight:700;font-size:13px;color:var(--mut)}.kt td:first-child{min-width:12em}
.tpbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding:8px 0;margin:8px 0;border-bottom:1px solid var(--line)}
.kt th:first-child,.kt td:first-child{position:sticky;left:0;z-index:1;background:var(--bg)}.kt th:first-child,.kt .kg td:first-child{background:var(--panel)}
@media (max-width:600px){.wrap{padding:14px 12px 88px}h1{font-size:24px}.top{flex-wrap:wrap;gap:8px}.song{padding:14px}.grid2{grid-template-columns:1fr}textarea{min-height:48vh;font-size:16px}.sheet{margin-top:14px}.kt table{min-width:0}.kt td:first-child{min-width:9em}.item .main{flex-basis:100%}.sheet{overflow-wrap:anywhere}}
@media (pointer:coarse){.pill,.pill.sm{min-height:44px}.pill.sm{padding:6px 16px}.item .pill.sm{padding:4px 12px;min-height:44px}input,select,textarea{font-size:16px}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}}
button.pill.sm[data-rm],button.pill.sm[data-rdel],button.pill.sm[data-ldel]:not(.danger){min-height:22px;width:22px;padding:0;font-size:10px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.pill.sm.ic{padding:0;width:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center}.pill.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}@media (pointer:coarse){.pill.sm.ic{width:44px;min-width:44px}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:600px){
.wrap{padding:10px max(10px,env(safe-area-inset-left,0px)) 88px max(10px,env(safe-area-inset-right,0px))}
.top{margin-bottom:10px}
.top .row{gap:6px;flex-wrap:nowrap}
.bar{gap:6px;margin:10px 0}
.pill.sm{white-space:nowrap}
.tpbar{margin:6px 0;padding:6px 0;flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}
.tpbar::-webkit-scrollbar{display:none}
.tpbar>span:first-child{display:none}
.tpbar .tp{flex:0 0 auto;gap:4px}
.tpbar .tp .k{min-width:2.6em;font-size:17px}
.tpbar .pill.sm{padding:4px 10px;min-width:40px;flex:0 0 auto}
.tpbar .pill.sm.ic{width:40px;padding:0}
.stgbar{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 0;scrollbar-width:none}
.stgbar::-webkit-scrollbar{display:none}
.stgbar>*{flex:0 0 auto}
.stgbar .tp{gap:4px}
.stgbar .pill.sm{padding:4px 10px;min-width:40px;white-space:nowrap}
.stgbar .stt{flex:0 1 auto;max-width:38vw;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel{padding:10px 12px}
.dlg{padding:16px}
}
@media (max-width:360px){.song{padding:12px 10px}h1{font-size:22px}.tpbar .tp .k{min-width:2.2em}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100% - 24px);background:var(--tx);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast .pill{border-color:var(--bg);color:var(--bg);flex:0 0 auto}
.stghead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}.stghead .stgbar{position:static;border-bottom:0}
.setlist{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.setlist::-webkit-scrollbar{display:none}.setlist .pill{flex:0 0 auto;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media print{.bar,.top button,.noprint{display:none}body{background:#fff;color:#000}.ch{color:#000}}

<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script>
const SUPABASE_URL=(window.JEZ&&window.JEZ.url)||'PASTE_YOUR_PROJECT_URL';
const SUPABASE_KEY=(window.JEZ&&window.JEZ.key)||'PASTE_YOUR_ANON_KEY';
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={};SH.forEach((n,i)=>IDX[n]=i);FL.forEach((n,i)=>IDX[n]=i);
const FLATKEYS=['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm'];
const SUF=/^(maj|min|m|M|dim|aug|sus|add|\+|°|ø|-|\d|#|b|\(|\))*$/;
const CH=/^([A-G][#b]?)([^\s\/]*)(?:\/([A-G][#b]?))?$/;
const isChord=t=>{const m=CH.exec(t);return !!m&&SUF.test(m[2])};
const SECT=/^\s*(\[?(verse|chorus|pre-?chorus|bridge|intro|outro|tag|interlude|instrumental|ending|refrain|turnaround)\b[^\[]*\]?)\s*:?\s*$/i;
const IC=(d)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>';
const ICO={stage:IC('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),pl:IC('<path d="M4 6h12M4 12h8M4 18h8"/><path d="M17 13v7M13.5 16.5h7"/>'),del:IC('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v6M14 10v6"/>'),save:IC('<path d="M5 3h12l2 2v16H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>'),orig:IC('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),dl:IC('<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>'),ok:IC('<path d="M5 12l5 5 9-10"/>')};
let songs=[],view={name:'list'},q='',mode='chords',shift=0,fs=18,memo=null;
let lists=[],tab='songs',showPl=false,pq='',memo2=null;
let chart=null,kq='',kl='all',ks='all',chartDirty=false,chartT=null,chartSynced='',chartCol=null,chartNote='';
let stage=false,auto=false,spd=3,sfs=26,scrollT=0,wl=null,cloud=null,cloudPath='',synced={},cloudState='local',pushT=null;

function load(){try{const s=localStorage.getItem('chordbook.songs');if(s)return JSON.parse(s)}catch(e){}return memo}
function save(){memo=songs;memo2=lists;try{localStorage.setItem('chordbook.songs',JSON.stringify(songs));localStorage.setItem('chordbook.lists',JSON.stringify(lists))}catch(e){}push()}
function loadLists(){try{const s=localStorage.getItem('chordbook.lists');if(s)return JSON.parse(s)}catch(e){}return memo2||[]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function useFlats(key,n){const t=tChord(key||'C',n,false);return FLATKEYS.includes(t)}
function tChord(c,n,flats){
  const m=CH.exec(c);if(!m)return c;
  const nm=r=>(flats?FL:SH)[(IDX[r]+n%12+12)%12];
  return nm(m[1])+m[2]+(m[3]?'/'+nm(m[3]):'');
}
function tr(c,n,key){return n?tChord(c,n,useFlats(key,n)):c}

// Convert "chords above lyrics" pasted text into inline [G] ChordPro
function convert(text){
  const L=text.replace(/\r/g,'').split('\n'),out=[];
  const isTok=t=>isChord(t)||/^(\||\|\||%|x\d+|\(?x\d+\)?|N\.?C\.?)$/i.test(t);
  const chordLine=s=>{const t=s.trim().split(/\s+/);return s.trim()&&t.every(isTok)&&t.some(isChord)};
  for(let i=0;i<L.length;i++){
    let l=L[i];
    const im=/^\s*(intro|instrumental|interlude|outro|turnaround|tag|ending)\s*:?\s+(\S.*)$/i.exec(l);
    if(im&&chordLine(im[2])){out.push(im[1][0].toUpperCase()+im[1].slice(1).toLowerCase());out.push(im[2].trim().split(/\s+/).map(w=>'['+w+']').join(' '));continue}
    if(chordLine(l)){
      const nx=L[i+1];
      const pos=[];l.replace(/\S+/g,(w,o)=>{pos.push([o,w])});
      if(nx!==undefined&&nx.trim()&&!chordLine(nx)&&!SECT.test(nx)){
        let s=nx;
        for(let k=pos.length-1;k>=0;k--){const[o,w]=pos[k];if(s.length<o)s=s.padEnd(o,' ');s=s.slice(0,o)+'['+w+']'+s.slice(o)}
        out.push(s);i++;
      }else out.push(pos.map(p=>'['+p[1]+']').join(' '));
    }else out.push(l);
  }
  return out.join('\n');
}
function songKey(s){if(s.key)return s.key;const m=/\[([^\]]+)\]/.exec(s.body);return m?m[1].replace(/\/.*/,''):''}

function chHtml(c){const m=/^([A-G][#b]?m?(?!aj))(.*?)(\/[A-G][#b]?)?$/.exec(c);if(!m)return esc(c);return esc(m[1])+(m[2]?'<sup>'+esc(m[2])+'</sup>':'')+esc(m[3]||'')}
function renderBody(s){
  const key=songKey(s);
  return s.body.split('\n').map(line=>{
    if(!line.trim())return '\u0001';
    if(!/\[[^\]]+\]/.test(line)&&SECT.test(line))return '\u0001<div class="sec">'+esc(line.replace(/^\[|\]$/g,'').replace(/:$/,''))+'</div>';
    if(mode==='lyrics')return '<div class="ln"><span class="ly">'+esc(line.replace(/\[[^\]]*\]/g,''))+'</span></div>';
    if(!/\[[^\]]+\]/.test(line))return '<div class="ln"><span class="seg"><span class="ly">'+esc(line)+'</span></span></div>';
    const parts=line.split(/\[([^\]]+)\]/);let h='<div class="ln">';
    if(parts[0])h+='<span class="seg"><span class="ch"></span><span class="ly">'+esc(parts[0])+'</span></span>';
    for(let i=1;i<parts.length;i+=2)h+='<span class="seg"><span class="ch">'+chHtml(tr(parts[i].trim(),shift,key))+'</span><span class="ly">'+esc(parts[i+1]||'')+'</span></span>';
    return h+'</div>';
  }).join('').split('\u0001').filter(b=>b.trim()).map(b=>'<div class="stanza">'+b+'</div>').join('');
}

const KN=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function startShift(v){
  if(v.name!=='song'||!v.from)return 0;
  const l=lists.find(x=>x.id===v.from),s=songs.find(x=>x.id===v.id);
  if(!l||!s||!l.keys||!l.keys[v.id])return 0;
  const o=/^[A-G][#b]?/.exec(songKey(s)||''),t=l.keys[v.id];
  if(!o||IDX[o[0]]===undefined||IDX[t]===undefined)return 0;
  return (IDX[t]-IDX[o[0]]+12)%12;
}
function keyLbl(l,s){
  const k=songKey(s)||'',o=/^[A-G][#b]?/.exec(k),c=l.keys&&l.keys[s.id];if(!o)return '<span class="key"></span>';
  const mn=/^[A-G][#b]?m(?!aj)/.test(k);
  return '<span class="key">'+esc(c?c+(mn?'m':''):k)+'</span>';
}
function keySel(l,s){
  const k=songKey(s)||'',o=/^[A-G][#b]?/.exec(k);if(!o)return '<span class="key"></span>';
  const mn=/^[A-G][#b]?m(?!aj)/.test(k),cur=(l.keys&&l.keys[s.id])||'';
  return '<select data-key="'+s.id+'" aria-label="Key for '+esc(s.title)+'" style="width:auto;max-width:9.5em;padding:6px 8px"><option value="">Original ('+esc(k)+')</option>'+KN.map(n=>'<option value="'+n+'"'+(cur===n?' selected':'')+'>'+n+(mn?'m':'')+'</option>').join('')+'</select>';
}
function go(v){view=v;shift=startShift(v);showPl=false;draw();window.scrollTo(0,0)}
function tabsHtml(){return '<div class="bar"><button class="pill sm '+(tab==='songs'?'on':'')+'" data-tab="songs">Songs ('+songs.length+')</button><button class="pill sm '+(tab==='lists'?'on':'')+'" data-tab="lists">Playlists ('+lists.length+')</button><button class="pill sm '+(tab==='keys'?'on':'')+'" data-tab="keys">Leader keys</button></div>'}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()})}
let lkNote='';
const nk=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function leaderKeyFor(ld,s){
  const t=nk(s.title),r=chart&&chart.rows&&chart.rows.find(x=>nk(x.song)===t);if(!r||!r.k)return null;
  const k=String(r.k[ld]||'').trim().replace(/^[a-g]/,c=>c.toUpperCase()),m=/^[A-G][#b]?/.exec(k);
  return m&&IDX[m[0]]!==undefined?m[0]:null;
}
function applyLeader(l,ld,only){
  l.keys=l.keys||{};
  if(!ld){if(!only){l.keys={};delete l.leader}return {set:0,miss:[]}}
  if(!only)l.leader=ld;
  let set=0;const miss=[];
  (only?[only]:l.songIds).forEach(id=>{
    const s=songs.find(x=>x.id===id);if(!s)return;
    const t=leaderKeyFor(ld,s),o=/^[A-G][#b]?/.exec(songKey(s)||'');
    if(!t||!o||IDX[o[0]]===undefined){miss.push(s.title);return}
    if(IDX[t]===IDX[o[0]])delete l.keys[id];else l.keys[id]=t;
    set++;
  });
  return {set,miss};
}
function addToList(l,id){if(l.songIds.includes(id))return;l.songIds.push(id);if(l.leader)applyLeader(l,l.leader,id)}
function mkList(name){const l={id:uid(),name,songIds:[]};lists.push(l);return l}
function drawLists(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="top"><h1>JEZ Chord Book</h1></div>'+tabsHtml()+
   '<div class="row" style="margin-bottom:8px"><input type="text" id="pn" placeholder="New playlist name" aria-label="New playlist name" style="flex:1"><button class="pill pri sm" id="np">Create playlist</button></div>'+
   '<div>'+(lists.length?lists.map(l=>'<button class="song" data-id="'+l.id+'"><div><b>'+esc(l.name)+'</b><span>'+l.songIds.length+' songs</span></div></button>').join(''):'<div class="empty">No playlists yet. Name one above, then add songs to it.</div>')+'</div>';
  bindTabs();
  document.getElementById('np').onclick=()=>{const n=document.getElementById('pn').value.trim();if(n){const l=mkList(n);save();go({name:'pl',id:l.id})}else document.getElementById('pn').focus()};
  app.querySelectorAll('.song').forEach(b=>b.onclick=()=>go({name:'pl',id:b.dataset.id}));
}
function drawPl(){
  const l=lists.find(x=>x.id===view.id);if(!l){tab='lists';return go({name:'list'})}
  l.songIds=l.songIds.filter(id=>songs.some(s=>s.id===id));

async function initCloud(){
  if(!CFG_OK||!window.supabase)return;
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const s0=await sb.auth.getSession();session=s0.data.session;
    sb.auth.onAuthStateChange(async(_e,ses)=>{session=ses;await refreshCan();stat();if(view.name!=='edit')draw()});
    await refreshCan();
    const r=await loadAll(),cs=r[0],cl=r[1];
    let flag='';try{flag=localStorage.getItem('chordbook.shared')||''}catch(e){}
    synced={songs:{},lists:{}};cs.forEach(x=>{synced.songs[x.id]=JSON.stringify(x)});cl.forEach(x=>{synced.lists[x.id]=JSON.stringify(x)});
    if(!cs.length&&canWrite){
      /* shared library is empty: this device's songs become the first upload */
    }else{
      const by={};cs.forEach(x=>{by[x.id]=x});
      if(canWrite&&!flag)songs.forEach(x=>{if(!by[x.id]&&x.id!=='sample')by[x.id]=x});
      songs=Object.keys(by).map(k=>by[k]);
      const lb={};cl.forEach(x=>{lb[x.id]=x});
      if(canWrite&&!flag)lists.forEach(x=>{if(!lb[x.id])lb[x.id]=x});
      lists=Object.keys(lb).map(k=>lb[k]);
    }
    cloud=sb;cloudState='cloud';

    if(view.name!=='edit')draw();
    push();initChart();
    sb.channel('band').on('postgres_changes',{event:'*',schema:'public',table:'songs'},pull).on('postgres_changes',{event:'*',schema:'public',table:'lists'},pull).subscribe();
  }catch(e){cloudState='error';stat()}
}
function push(){if(!cloud)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(doPush,700)}
async function doPush(){
  try{
    const sm={},lm={},su=[],lu=[];
    songs.forEach(s=>{const j=JSON.stringify(s);sm[s.id]=j;if(synced.songs[s.id]!==j)su.push({id:s.id,data:s})});
    lists.forEach(l=>{const j=JSON.stringify(l);lm[l.id]=j;if(synced.lists[l.id]!==j)lu.push({id:l.id,data:l})});
    if(canWrite&&su.length){const r=await sb.from('songs').upsert(su);if(r.error)throw r.error}
    if(lu.length){const r=await sb.from('lists').upsert(lu);if(r.error)throw r.error}
    const ds=canWrite?Object.keys(synced.songs).filter(k=>!sm[k]):[];
    if(ds.length){const r=await sb.from('songs').delete().in('id',ds);if(r.error)throw r.error}
    const dl=canWrite?Object.keys(synced.lists).filter(k=>!lm[k]):[];
    if(dl.length){const r=await sb.from('lists').delete().in('id',dl);if(r.error)throw r.error}
    if(canWrite)synced.songs=sm;synced.lists=lm;cloudState='cloud';
  }catch(e){cloudState='error'}
  dirty=false;stat();
}

const FF='"Helvetica Neue",Helvetica,Arial,sans-serif';
function chParts(c){const m=/^([A-G][#b]?m?(?!aj))(.*?)(\/[A-G][#b]?)?$/.exec(c);return m?{r:m[1],e:m[2]||'',b:m[3]||''}:{r:c,e:'',b:''}}
function chMeasure(ctx,c,sz){const p=chParts(c);ctx.font=sz+'px '+FF;let w=ctx.measureText(p.r).width+ctx.measureText(p.b).width;if(p.e){ctx.font=(sz*.62)+'px '+FF;w+=ctx.measureText(p.e).width}return w}
function chDraw(ctx,x,y,c,sz){const p=chParts(c);ctx.font=sz+'px '+FF;ctx.fillText(p.r,x,y);let w=ctx.measureText(p.r).width;if(p.e){ctx.font=(sz*.62)+'px '+FF;ctx.fillText(p.e,x+w,y-sz*.38);w+=ctx.measureText(p.e).width}if(p.b){ctx.font=sz+'px '+FF;ctx.fillText(p.b,x+w,y)}}
function songCanvas(s,sh,md){
  const W=1200,M=80,MW=W-2*M,FS=36,CS=32,LH=Math.round(FS*1.3),CHH=Math.round(CS*1.1);
  const key=songKey(s),tk=key?tr(key,sh,key):'',m=document.createElement('canvas').getContext('2d');
  const lyF=FS+'px '+FF,rows=[],hasCh=/\[[^\]]+\]/;
  let gap=false;
  s.body.split('\n').forEach(line=>{
    if(!line.trim()){gap=true;return}
    if(!hasCh.test(line)&&SECT.test(line)){rows.push({t:'sec',x:line.replace(/^\[|\]$/g,'').replace(/:$/,'').trim(),g:rows.length>0});gap=false;return}
    if(md==='lyrics'&&!line.replace(/\[[^\]]*\]/g,'').trim())return;
    if(gap&&rows.length&&rows[rows.length-1].t==='line')rows.push({t:'gap'});
    gap=false;
    const parts=line.split(/\[([^\]]+)\]/),pcs=[];
    const add=(ch,t)=>{if(md==='lyrics')ch='';const w=t.match(/\S+\s*|\s+/g);if(!w){if(ch)pcs.push({c:ch,t:''});return}w.forEach((x,i)=>pcs.push({c:i?'':ch,t:x}))};
    add('',parts[0]);for(let i=1;i<parts.length;i+=2)add(tr(parts[i].trim(),sh,key),parts[i+1]||'');
    const rs=[[]];let x=0;
    pcs.forEach(p=>{m.font=lyF;const tw=m.measureText(p.t).width,cw=p.c?chMeasure(m,p.c,CS)+16:0,w=Math.max(tw,cw);if(x>0&&x+w>MW){rs.push([]);x=0}rs[rs.length-1].push({x:x,c:p.c,t:p.t});x+=w});
    rs.forEach(r=>{if(r.length)rows.push({t:'line',items:r,ch:r.some(i=>i.c)})});
  });
  let H=M+50+(s.artist?44:0)+(tk?50:0)+30;
  rows.forEach(r=>{H+=r.t==='sec'?(r.g?36:0)+Math.round(FS*1.45):r.t==='gap'?36:(r.ch?CHH:0)+LH+6});
  H+=M;
  const cv=document.createElement('canvas');cv.width=W;cv.height=Math.ceil(H);
  const c=cv.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,W,cv.height);c.textBaseline='alphabetic';
  let y=M+50,ts=56;
  c.font='bold '+ts+'px '+FF;while(c.measureText(s.title).width>MW&&ts>26){ts-=2;c.font='bold '+ts+'px '+FF}
  c.fillStyle='#111111';c.fillText(s.title,M,y);
  if(s.artist){y+=44;c.font='30px '+FF;c.fillStyle='#666666';c.fillText(s.artist,M,y)}
  if(tk){y+=50;c.font='bold 32px '+FF;c.fillStyle='#0b6e55';c.fillText('Key of '+tk+(sh?' (original '+key+')':''),M,y)}
  y+=30;
  rows.forEach(r=>{
    if(r.t==='sec'){if(r.g)y+=36;c.font='bold '+Math.round(FS*1.05)+'px '+FF;c.fillStyle='#111111';c.fillText(r.x,M,y+FS);y+=Math.round(FS*1.45);return}
    if(r.t==='gap'){y+=36;return}
    const top=y;
    r.items.forEach(it=>{
      if(it.c){c.fillStyle='#0b6e55';chDraw(c,M+it.x,top+Math.round(CHH*.85),it.c,CS)}
      c.font=lyF;c.fillStyle='#111111';c.fillText(it.t,M+it.x,top+(r.ch?CHH:0)+FS);
    });
    y+=(r.ch?CHH:0)+LH+6;
  });
  return cv;
}
async function dlJpeg(s,btn){
  const old=btn.innerHTML,oldT=btn.title;
  let fail='';
  try{
    btn.disabled=true;btn.textContent='…';btn.title='Making image...';
    /* Built synchronously (no waiting) so phones still count this as a tap, which the share sheet requires. */
    const cv=songCanvas(s,shift,mode);
    const b64=(cv.toDataURL('image/jpeg',0.92)||'').split(',')[1];
    if(!b64)throw 0;
    const bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const key=songKey(s),tk=key?tr(key,shift,key):'';
    const name=((s.title+(tk?' - Key of '+tk:'')).replace(/[/:*?"<>|]/g,'').trim()||'chord-chart')+'.jpg';
    const file=new File([u8],name,{type:'image/jpeg'});
    let done=false;
    /* On phones, open the share sheet so the picture can go straight into Photos / Gallery. */
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:s.title});done=true}
      catch(e){if(e&&e.name==='AbortError'){fail='Cancelled';throw 0}}
    }
    if(!done){
      const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
    }
    btn.innerHTML=ICO.ok;btn.title='Saved';
  }catch(e){btn.textContent='✕';btn.title=fail||'Could not save'}
  setTimeout(()=>{btn.innerHTML=old;btn.title=oldT;btn.disabled=false},2500);
}

function askDel(msg,yes){

  o.innerHTML='<div class="dlg"><b>Are you sure you want to delete?</b><p></p><div class="row" style="justify-content:flex-end"><button class="pill sm" id="dc0">Cancel</button><button class="pill sm danger" id="dy0">Yes, delete</button></div></div>';
  o.querySelector('p').textContent=msg+(cloudState==='cloud'&&canWrite?' This removes it for everyone who uses the shared library.':'');

function normChart(c){
  const o={id:'main',leaders:Array.isArray(c.leaders)?c.leaders:[],rows:[]};
  if(Array.isArray(c.rows))o.rows=c.rows;
  else if(Array.isArray(c.sections))c.sections.forEach(s=>(s.groups||[]).forEach(g=>(g.rows||[]).forEach(r=>o.rows.push(r))));
  o.rows=o.rows.map(r=>({id:r.id||rid(),song:String(r.song||''),k:r.k||{},slot:(/^[23]$/.test(String(r.slot||''))?'F':String(r.slot||''))}));

function pushChart(){
