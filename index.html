<div class="wrap" id="app"></div>
<script>
const SUPABASE_URL='PASTE_YOUR_PROJECT_URL';
const SUPABASE_KEY='PASTE_YOUR_ANON_KEY';
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const IDX={};SH.forEach((n,i)=>IDX[n]=i);FL.forEach((n,i)=>IDX[n]=i);
const FLATKEYS=['F','Bb','Eb','Ab','Db','Gb','Dm','Gm','Cm','Fm','Bbm','Ebm'];
const SUF=/^(maj|min|m|M|dim|aug|sus|add|\+|°|ø|-|\d|#|b|\(|\))*$/;
const CH=/^([A-G][#b]?)([^\s\/]*)(?:\/([A-G][#b]?))?$/;
const isChord=t=>{const m=CH.exec(t);return !!m&&SUF.test(m[2])};
const SECT=/^\s*(\[?(verse|chorus|pre-?chorus|bridge|intro|outro|tag|interlude|instrumental|ending|refrain|turnaround)\b[^\[]*\]?)\s*:?\s*$/i;
let songs=[],view={name:'list'},q='',mode='chords',shift=0,fs=18,memo=null;
let lists=[],tab='songs',showPl=false,pq='',memo2=null;
let stage=false,auto=false,spd=3,sfs=26,scrollT=0,wl=null,cloud=null,cloudPath='',synced={},cloudState='local',pushT=null;

function load(){try{const s=localStorage.getItem('chordbook.songs');if(s)return JSON.parse(s)}catch(e){}return memo}
function save(){memo=songs;memo2=lists;try{localStorage.setItem('chordbook.songs',JSON.stringify(songs));localStorage.setItem('chordbook.lists',JSON.stringify(lists))}catch(e){}push()}
function loadLists(){try{const s=localStorage.getItem('chordbook.lists');if(s)return JSON.parse(s)}catch(e){}return memo2||[]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function useFlats(key,n){const t=tChord(key||'C',n,false);return FLATKEYS.includes(t)}
function tChord(c,n,flats){
  const m=CH.exec(c);if(!m)return c;
  const nm=r=>(flats?FL:SH)[(IDX[r]+n%12+12)%12];
  return nm(m[1])+m[2]+(m[3]?'/'+nm(m[3]):'');
}
function tr(c,n,key){return n?tChord(c,n,useFlats(key,n)):c}

// Convert "chords above lyrics" pasted text into inline [G] ChordPro
function convert(text){
  const L=text.replace(/\r/g,'').split('\n'),out=[];
  const isTok=t=>isChord(t)||/^(\||\|\||%|x\d+|\(?x\d+\)?|N\.?C\.?)$/i.test(t);
  const chordLine=s=>{const t=s.trim().split(/\s+/);return s.trim()&&t.every(isTok)&&t.some(isChord)};
  for(let i=0;i<L.length;i++){
    let l=L[i];
    const im=/^\s*(intro|instrumental|interlude|outro|turnaround|tag|ending)\s*:?\s+(\S.*)$/i.exec(l);
    if(im&&chordLine(im[2])){out.push(im[1][0].toUpperCase()+im[1].slice(1).toLowerCase());out.push(im[2].trim().split(/\s+/).map(w=>'['+w+']').join(' '));continue}
    if(chordLine(l)){
      const nx=L[i+1];
      const pos=[];l.replace(/\S+/g,(w,o)=>{pos.push([o,w])});
      if(nx!==undefined&&nx.trim()&&!chordLine(nx)&&!SECT.test(nx)){
        let s=nx;
        for(let k=pos.length-1;k>=0;k--){const[o,w]=pos[k];if(s.length<o)s=s.padEnd(o,' ');s=s.slice(0,o)+'['+w+']'+s.slice(o)}
        out.push(s);i++;
      }else out.push(pos.map(p=>'['+p[1]+']').join(' '));
    }else out.push(l);
  }
  return out.join('\n');
}
function songKey(s){if(s.key)return s.key;const m=/\[([^\]]+)\]/.exec(s.body);return m?m[1].replace(/\/.*/,''):''}

function chHtml(c){const m=/^([A-G][#b]?m?(?!aj))(.*?)(\/[A-G][#b]?)?$/.exec(c);if(!m)return esc(c);return esc(m[1])+(m[2]?'<sup>'+esc(m[2])+'</sup>':'')+esc(m[3]||'')}
function renderBody(s){
  const key=songKey(s);
  return s.body.split('\n').map(line=>{
    if(!line.trim())return '\u0001';
    if(!/\[[^\]]+\]/.test(line)&&SECT.test(line))return '\u0001<div class="sec">'+esc(line.replace(/^\[|\]$/g,'').replace(/:$/,''))+'</div>';
    if(mode==='lyrics')return '<div class="ln"><span class="ly">'+esc(line.replace(/\[[^\]]*\]/g,''))+'</span></div>';
    if(!/\[[^\]]+\]/.test(line))return '<div class="ln"><span class="seg"><span class="ly">'+esc(line)+'</span></span></div>';
    const parts=line.split(/\[([^\]]+)\]/);let h='<div class="ln">';
    if(parts[0])h+='<span class="seg"><span class="ch"></span><span class="ly">'+esc(parts[0])+'</span></span>';
    for(let i=1;i<parts.length;i+=2)h+='<span class="seg"><span class="ch">'+chHtml(tr(parts[i].trim(),shift,key))+'</span><span class="ly">'+esc(parts[i+1]||'')+'</span></span>';
    return h+'</div>';
  }).join('').split('\u0001').filter(b=>b.trim()).map(b=>'<div class="stanza">'+b+'</div>').join('');
}

const KN=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function startShift(v){
  if(v.name!=='song'||!v.from)return 0;
  const l=lists.find(x=>x.id===v.from),s=songs.find(x=>x.id===v.id);
  if(!l||!s||!l.keys||!l.keys[v.id])return 0;
  const o=/^[A-G][#b]?/.exec(songKey(s)||''),t=l.keys[v.id];
  if(!o||IDX[o[0]]===undefined||IDX[t]===undefined)return 0;
  return (IDX[t]-IDX[o[0]]+12)%12;
}
function keyLbl(l,s){
  const k=songKey(s)||'',o=/^[A-G][#b]?/.exec(k),c=l.keys&&l.keys[s.id];if(!o)return '<span class="key"></span>';
  const mn=/^[A-G][#b]?m(?!aj)/.test(k);
  return '<span class="key">'+esc(c?c+(mn?'m':''):k)+'</span>';
}
function keySel(l,s){
  const k=songKey(s)||'',o=/^[A-G][#b]?/.exec(k);if(!o)return '<span class="key"></span>';
  const mn=/^[A-G][#b]?m(?!aj)/.test(k),cur=(l.keys&&l.keys[s.id])||'';
  return '<select data-key="'+s.id+'" aria-label="Key for '+esc(s.title)+'" style="width:auto;max-width:9.5em;padding:6px 8px"><option value="">Original ('+esc(k)+')</option>'+KN.map(n=>'<option value="'+n+'"'+(cur===n?' selected':'')+'>'+n+(mn?'m':'')+'</option>').join('')+'</select>';
}
function go(v){view=v;shift=startShift(v);showPl=false;draw();window.scrollTo(0,0)}
function tabsHtml(){return '<div class="bar"><button class="pill sm '+(tab==='songs'?'on':'')+'" data-tab="songs">Songs ('+songs.length+')</button><button class="pill sm '+(tab==='lists'?'on':'')+'" data-tab="lists">Playlists ('+lists.length+')</button></div>'}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()})}
function mkList(name){const l={id:uid(),name,songIds:[]};lists.push(l);return l}
function drawLists(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="top"><h1>JEZ Chord Book</h1></div>'+tabsHtml()+
   '<div class="row" style="margin-bottom:8px"><input type="text" id="pn" placeholder="New playlist name" aria-label="New playlist name" style="flex:1"><button class="pill pri sm" id="np">Create playlist</button></div>'+
   '<div>'+(lists.length?lists.map(l=>'<button class="song" data-id="'+l.id+'"><div><b>'+esc(l.name)+'</b><span>'+l.songIds.length+' songs</span></div></button>').join(''):'<div class="empty">No playlists yet. Name one above, then add songs to it.</div>')+'</div>';
  bindTabs();
  document.getElementById('np').onclick=()=>{const n=document.getElementById('pn').value.trim();if(n){const l=mkList(n);save();go({name:'pl',id:l.id})}else document.getElementById('pn').focus()};
  app.querySelectorAll('.song').forEach(b=>b.onclick=()=>go({name:'pl',id:b.dataset.id}));
}
function drawPl(){
  const l=lists.find(x=>x.id===view.id);if(!l){tab='lists';return go({name:'list'})}
  l.songIds=l.songIds.filter(id=>songs.some(s=>s.id===id));
  const app=document.getElementById('app'),ss=l.songIds.map(id=>songs.find(s=>s.id===id));
  const avail=songs.filter(s=>!l.songIds.includes(s.id)&&(s.title+' '+(s.artist||'')).toLowerCase().includes(pq.toLowerCase())).sort((a,b)=>a.title.localeCompare(b.title));
  app.innerHTML='<div class="top"><button class="pill sm" id="back">Back</button><button class="pill sm danger" id="del">Delete playlist</button></div>'+
   '<div class="row"><input type="text" id="rn" value="'+esc(l.name)+'" aria-label="Playlist name" style="flex:1;font-size:22px;font-weight:700"><button class="pill sm" id="rb">Rename</button></div>'+
   '<p class="hint">'+ss.length+' songs. Tap a song to open it, then use Previous and Next to move through the playlist. To change a song’s key, open it, transpose, and tap Save key to playlist.</p>'+
   '<div>'+(ss.length?ss.map((s,i)=>'<div class="item"><button class="main" data-open="'+s.id+'"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||'')+'</span></button>'+keyLbl(l,s)+'<button class="pill sm" data-up="'+i+'" aria-label="Move up">↑</button><button class="pill sm" data-dn="'+i+'" aria-label="Move down">↓</button><button class="pill sm" data-rm="'+i+'" aria-label="Remove from playlist">✕</button></div>').join(''):'<div class="empty">This playlist is empty. Add songs below.</div>')+'</div>'+
   '<h2>Add songs</h2><input type="search" id="pq" placeholder="Search your library" aria-label="Search your library" value="'+esc(pq)+'">'+
   '<div>'+(avail.length?avail.map(s=>'<div class="item"><div class="main"><b>'+esc(s.title)+'</b><span>'+esc(s.artist||'')+'</span></div><button class="pill sm" data-add="'+s.id+'">Add</button></div>').join(''):'<div class="empty">'+(songs.length?'No more songs to add.':'Add songs to your library first.')+'</div>')+'</div>';
  const $=i=>document.getElementById(i),ids=l.songIds;
  $('back').onclick=()=>{tab='lists';go({name:'list'})};
  $('rb').onclick=()=>{const n=$('rn').value.trim();if(n){l.name=n;save();$('rb').textContent='Renamed'}};
  $('del').onclick=()=>askDel('Delete the playlist “'+l.name+'”? The songs stay in your library.',()=>{lists=lists.filter(x=>x.id!==l.id);save();tab='lists';go({name:'list'})});
  const pi=$('pq');pi.oninput=()=>{pq=pi.value;const p=pi.selectionStart;draw();const n=$('pq');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go({name:'song',id:b.dataset.open,from:l.id}));
  app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[ids[i-1],ids[i]]=[ids[i],ids[i-1]];save();draw()}});
  app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;if(i<ids.length-1){[ids[i+1],ids[i]]=[ids[i],ids[i+1]];save();draw()}});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ids.splice(+b.dataset.rm,1);save();draw()});
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ids.push(b.dataset.add);save();draw()});
}
function plPanel(s){
  if(!showPl)return '';
  return '<div class="panel noprint"><b>Add to playlist</b>'+(lists.length?lists.map(l=>'<label><input type="checkbox" data-pl="'+l.id+'"'+(l.songIds.includes(s.id)?' checked':'')+'> '+esc(l.name)+'</label>').join(''):'<p class="hint">You have no playlists yet. Create one below.</p>')+
   '<div class="row" style="margin-top:8px"><input type="text" id="npn" placeholder="New playlist name" aria-label="New playlist name" style="flex:1"><button class="pill sm" id="npb">Create and add</button></div></div>';
}
function navHtml(s){
  if(!view.from)return '';
  const l=lists.find(x=>x.id===view.from);if(!l)return '';
  const i=l.songIds.indexOf(s.id);if(i<0)return '';
  return '<div class="bar noprint" style="margin-top:32px;justify-content:space-between"><button class="pill sm" data-nav="-1"'+(i===0?' disabled':'')+'>Previous</button><span style="color:var(--mut)">'+esc(l.name)+': '+(i+1)+' of '+l.songIds.length+'</span><button class="pill sm" data-nav="1"'+(i===l.songIds.length-1?' disabled':'')+'>Next</button></div>';
}
function bindPl(s){
  const $=i=>document.getElementById(i);
  $('pls').onclick=()=>{showPl=!showPl;draw()};
  document.querySelectorAll('[data-pl]').forEach(c=>c.onchange=()=>{const l=lists.find(x=>x.id===c.dataset.pl);if(!l)return;if(c.checked){if(!l.songIds.includes(s.id))l.songIds.push(s.id)}else l.songIds=l.songIds.filter(i=>i!==s.id);save();draw()});
  const nb=$('npb');if(nb)nb.onclick=()=>{const n=$('npn').value.trim();if(!n){$('npn').focus();return}const l=mkList(n);l.songIds.push(s.id);save();draw()};
  const l=view.from&&lists.find(x=>x.id===view.from);
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const j=l.songIds.indexOf(s.id)+ +b.dataset.nav,id=l.songIds[j];if(id)go({name:'song',id,from:l.id})});
}
function draw(){clearInterval(scrollT);
  const app=document.getElementById('app');
  if(view.name==='pl'){drawPl();return}
  if(view.name==='list'&&tab==='lists'){drawLists();return}
  if(view.name==='list'){
    const f=songs.filter(s=>(s.title+' '+(s.artist||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.title.localeCompare(b.title));
    app.innerHTML='<div class="top"><h1>JEZ Chord Book</h1><button class="pill pri" id="new">Add song</button></div>'+tabsHtml()+
      '<input type="search" id="q" placeholder="Search by title or artist" aria-label="Search songs" value="'+esc(q)+'">'+
      '<div>'+(f.length?f.map(s=>'<button class="song" data-id="'+s.id+'"><div><b>'+esc(s.title)+'</b><span>'+esc(s.artist||'No artist')+'</span></div><div class="key">'+esc(songKey(s))+'</div></button>').join(''):'<div class="empty">'+(songs.length?'No songs match your search.':'Your library is empty. Add your first song.')+'</div>')+'</div>'+
      '<div class="foot noprint"><div class="row"><button class="pill sm" id="exp">Export backup</button><button class="pill sm" id="imp">Import backup</button><input type="file" id="file" accept=".json" hidden></div><p class="hint" id="sync">'+syncText()+'</p><div class="row" id="auth" style="margin-top:8px">'+authHtml()+'</div><div class="msg" id="msg"></div></div>';
    document.getElementById('new').onclick=()=>go({name:'edit'});bindTabs();
    const qi=document.getElementById('q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;draw();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
    app.querySelectorAll('.song').forEach(b=>b.onclick=()=>go({name:'song',id:b.dataset.id}));
    document.getElementById('exp').onclick=exportAll;bindAuth();
    document.getElementById('imp').onclick=()=>document.getElementById('file').click();
    document.getElementById('file').onchange=importAll;

async function initCloud(){
  if(!CFG_OK||!window.supabase)return;
  try{
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const s0=await sb.auth.getSession();session=s0.data.session;
    sb.auth.onAuthStateChange(async(_e,ses)=>{session=ses;await refreshCan();stat();if(view.name!=='edit')draw()});
    await refreshCan();
    const r=await loadAll(),cs=r[0],cl=r[1];
    let flag='';try{flag=localStorage.getItem('chordbook.shared')||''}catch(e){}
    synced={songs:{},lists:{}};cs.forEach(x=>{synced.songs[x.id]=JSON.stringify(x)});cl.forEach(x=>{synced.lists[x.id]=JSON.stringify(x)});
    if(!cs.length&&canWrite){
      /* shared library is empty: this device's songs become the first upload */
    }else{
      const by={};cs.forEach(x=>{by[x.id]=x});
      if(canWrite&&!flag)songs.forEach(x=>{if(!by[x.id]&&x.id!=='sample')by[x.id]=x});
      songs=Object.keys(by).map(k=>by[k]);
      const lb={};cl.forEach(x=>{lb[x.id]=x});
      if(canWrite&&!flag)lists.forEach(x=>{if(!lb[x.id])lb[x.id]=x});
      lists=Object.keys(lb).map(k=>lb[k]);

    push();
    sb.channel('band').on('postgres_changes',{event:'*',schema:'public',table:'songs'},pull).on('postgres_changes',{event:'*',schema:'public',table:'lists'},pull).subscribe();
  }catch(e){cloudState='error';stat()}
}
function push(){if(!cloud||!canWrite)return;dirty=true;clearTimeout(pushT);pushT=setTimeout(doPush,700)}
async function doPush(){
  try{
    const sm={},lm={},su=[],lu=[];
    songs.forEach(s=>{const j=JSON.stringify(s);sm[s.id]=j;if(synced.songs[s.id]!==j)su.push({id:s.id,data:s})});
    lists.forEach(l=>{const j=JSON.stringify(l);lm[l.id]=j;if(synced.lists[l.id]!==j)lu.push({id:l.id,data:l})});
    if(su.length){const r=await sb.from('songs').upsert(su);if(r.error)throw r.error}
    if(lu.length){const r=await sb.from('lists').upsert(lu);if(r.error)throw r.error}
    const ds=Object.keys(synced.songs).filter(k=>!sm[k]);
    if(ds.length){const r=await sb.from('songs').delete().in('id',ds);if(r.error)throw r.error}
    const dl=Object.keys(synced.lists).filter(k=>!lm[k]);
    if(dl.length){const r=await sb.from('lists').delete().in('id',dl);if(r.error)throw r.error}
    synced.songs=sm;synced.lists=lm;cloudState='cloud';
  }catch(e){cloudState='error'}
  dirty=false;stat();
}

const FF='"Helvetica Neue",Helvetica,Arial,sans-serif';
function chParts(c){const m=/^([A-G][#b]?m?(?!aj))(.*?)(\/[A-G][#b]?)?$/.exec(c);return m?{r:m[1],e:m[2]||'',b:m[3]||''}:{r:c,e:'',b:''}}
function chMeasure(ctx,c,sz){const p=chParts(c);ctx.font=sz+'px '+FF;let w=ctx.measureText(p.r).width+ctx.measureText(p.b).width;if(p.e){ctx.font=(sz*.62)+'px '+FF;w+=ctx.measureText(p.e).width}return w}
function chDraw(ctx,x,y,c,sz){const p=chParts(c);ctx.font=sz+'px '+FF;ctx.fillText(p.r,x,y);let w=ctx.measureText(p.r).width;if(p.e){ctx.font=(sz*.62)+'px '+FF;ctx.fillText(p.e,x+w,y-sz*.38);w+=ctx.measureText(p.e).width}if(p.b){ctx.font=sz+'px '+FF;ctx.fillText(p.b,x+w,y)}}
function songCanvas(s,sh,md){
  const W=1200,M=80,MW=W-2*M,FS=36,CS=32,LH=Math.round(FS*1.3),CHH=Math.round(CS*1.1);
  const key=songKey(s),tk=key?tr(key,sh,key):'',m=document.createElement('canvas').getContext('2d');
  const lyF=FS+'px '+FF,rows=[],hasCh=/\[[^\]]+\]/;
  let gap=false;
  s.body.split('\n').forEach(line=>{
    if(!line.trim()){gap=true;return}
    if(!hasCh.test(line)&&SECT.test(line)){rows.push({t:'sec',x:line.replace(/^\[|\]$/g,'').replace(/:$/,'').trim(),g:rows.length>0});gap=false;return}
    if(md==='lyrics'&&!line.replace(/\[[^\]]*\]/g,'').trim())return;
    if(gap&&rows.length&&rows[rows.length-1].t==='line')rows.push({t:'gap'});
    gap=false;
    const parts=line.split(/\[([^\]]+)\]/),pcs=[];
    const add=(ch,t)=>{if(md==='lyrics')ch='';const w=t.match(/\S+\s*|\s+/g);if(!w){if(ch)pcs.push({c:ch,t:''});return}w.forEach((x,i)=>pcs.push({c:i?'':ch,t:x}))};
    add('',parts[0]);for(let i=1;i<parts.length;i+=2)add(tr(parts[i].trim(),sh,key),parts[i+1]||'');
    const rs=[[]];let x=0;
    pcs.forEach(p=>{m.font=lyF;const tw=m.measureText(p.t).width,cw=p.c?chMeasure(m,p.c,CS)+16:0,w=Math.max(tw,cw);if(x>0&&x+w>MW){rs.push([]);x=0}rs[rs.length-1].push({x:x,c:p.c,t:p.t});x+=w});
    rs.forEach(r=>{if(r.length)rows.push({t:'line',items:r,ch:r.some(i=>i.c)})});
  });
  let H=M+50+(s.artist?44:0)+(tk?50:0)+30;
  rows.forEach(r=>{H+=r.t==='sec'?(r.g?36:0)+Math.round(FS*1.45):r.t==='gap'?36:(r.ch?CHH:0)+LH+6});
  H+=M;
  const cv=document.createElement('canvas');cv.width=W;cv.height=Math.ceil(H);
  const c=cv.getContext('2d');c.fillStyle='#ffffff';c.fillRect(0,0,W,cv.height);c.textBaseline='alphabetic';
  let y=M+50,ts=56;
  c.font='bold '+ts+'px '+FF;while(c.measureText(s.title).width>MW&&ts>26){ts-=2;c.font='bold '+ts+'px '+FF}
  c.fillStyle='#111111';c.fillText(s.title,M,y);
  if(s.artist){y+=44;c.font='30px '+FF;c.fillStyle='#666666';c.fillText(s.artist,M,y)}
  if(tk){y+=50;c.font='bold 32px '+FF;c.fillStyle='#0b6e55';c.fillText('Key of '+tk+(sh?' (original '+key+')':''),M,y)}
  y+=30;
  rows.forEach(r=>{
    if(r.t==='sec'){if(r.g)y+=36;c.font='bold '+Math.round(FS*1.05)+'px '+FF;c.fillStyle='#111111';c.fillText(r.x,M,y+FS);y+=Math.round(FS*1.45);return}
    if(r.t==='gap'){y+=36;return}
    const top=y;
    r.items.forEach(it=>{
      if(it.c){c.fillStyle='#0b6e55';chDraw(c,M+it.x,top+Math.round(CHH*.85),it.c,CS)}
      c.font=lyF;c.fillStyle='#111111';c.fillText(it.t,M+it.x,top+(r.ch?CHH:0)+FS);
    });
    y+=(r.ch?CHH:0)+LH+6;
  });
  return cv;
}
